# This is a basic workflow to help you get started with Actions

name: Hello world

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    types: ['ready_for_review', 'synchronize', 'labeled']

permissions:
  actions: read 

env:
  TEST: "TEST"
  TEST_DEV: "${{ github.event.repository.name }}"
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4


      - name: Set Branch Credentials
        run: |
          BRANCH_NAME=$TEST
          echo "BRANCH_ENVIRONMENT_NAME=${BRANCH_NAME}_DEV" >> $GITHUB_ENV


      - name: Check if `manual.yaml` workflow succeeded for the same commit
        uses: actions/github-script@v6
        id: check_manual_workflow
        with:
          script: |
            const commitSHA = process.env.GITHUB_SHA;
            const branchName = process.env.GITHUB_REF_NAME;

            // Fetch workflow runs for `manual.yaml`
            const workflowRuns = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'manual.yaml', // Replace with the path or ID of the workflow
              branch: branchName,
            });

            # // Check if there's a successful run for the current commit SHA
            # const successRun = workflowRuns.data.workflow_runs.find(run =>
            #   run.head_sha === commitSHA && run.conclusion === 'success'
            # );

            # if (successRun) {
            #   core.info(`Found successful run: ${successRun.id}`);
            # } else {
            #   core.setFailed('No successful workflow run found for the same commit in `manual.yaml`.');
            # }
      
      - name: Deploy
        run: echo ${{ env[env.BRANCH_ENVIRONMENT_NAME] }}

