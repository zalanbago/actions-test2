# This is a basic workflow to help you get started with Actions

name: Hello world

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    types: ['ready_for_review', 'synchronize', 'labeled']

permissions:
  actions: read 

env:
  TEST: "TEST"
  TEST_DEV: "${{ github.event.repository.name }}"
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4


      - name: Set Branch Credentials
        run: |
          BRANCH_NAME=$TEST
          echo "BRANCH_ENVIRONMENT_NAME=${BRANCH_NAME}_DEV" >> $GITHUB_ENV


      - name: Check if `manual.yaml` workflow succeeded for the same commit
        uses: actions/github-script@v6
        id: check_manual_workflow
        with:
          script: |
            const branchName = context.ref.replace('refs/heads/', '');


            const branchName = process.env.GITHUB_HEAD_REF;

            core.info(`Branch being queried: ${branchName}`);
            
            try {
              // Fetch workflow runs for `manual.yaml`
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'manual.yaml', // Replace with actual workflow name or ID
                branch: branchName, // Current branch name
              });

              if (!response.data.workflow_runs || response.data.workflow_runs.length === 0) {
                core.setFailed('No workflow runs found for manual.yaml on branch: ' + branchName);
                return;
              }

              // Find successful workflow run for the same commit
              const commitSHA = process.env.GITHUB_SHA;
              const successRun = response.data.workflow_runs.find(run => 
                run.head_sha === commitSHA && run.conclusion === 'success'
              );

              if (successRun) {
                core.info(`Found successful run: ${successRun.id}`);
              } else {
                core.setFailed('No successful workflow run found for the same commit in manual.yaml on branch: ' + branchName);
              }
            } catch (err) {
              core.setFailed(`Error fetching workflow runs: ${err.message}`);
            }
      
      - name: Deploy
        run: echo ${{ env[env.BRANCH_ENVIRONMENT_NAME] }}

